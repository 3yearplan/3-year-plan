<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Year Plan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>3-Year Plan</h1>

    <div id="controls">
        <button onclick="selectCountry('blue')">Blue Country</button>
        <button onclick="selectCountry('red')">Red Country</button>
        <button onclick="selectCountry('green')">Green Country</button>
        <button onclick="selectCountry('yellow')">Yellow Country</button>
        <button onclick="selectCountry('purple')">Purple Country</button>
        <button onclick="selectCountry(null)">Erase</button>
    </div>

    <p id="selected">Selected: Blue Country</p>

    <canvas id="gameMap"></canvas>

    <script src="script.js"></script>
</body>
</html>
